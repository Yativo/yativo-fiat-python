[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yativo-fiat-sdk"
version = "1.0.0"
description = "Official Python SDK for the Yativo Fiat API: payins, payouts, virtual accounts, cards and webhooks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["yativo", "payments", "payins", "payouts", "webhooks", "fintech"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://yativo.github.io/yativo-sdks/"
Documentation = "https://docs.yativo.com"
Source = "https://github.com/Yativo/yativo-fiat-python"
Issues = "https://github.com/Yativo/yativo-fiat-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yativo_fiat = ["py.typed"]
