name: Generated code

# Fails when src was edited by hand or spec/endpoints.json changed without regenerating.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.23'
      - run: python3 tools/generate.py --lang python --root .
      - run: git diff --exit-code
