name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste API keys, secrets, webhook secrets or customer data. Security issues go to security@yativo.com."
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: "e.g. Node 20 on Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code to reproduce
      description: The smallest example that shows the problem. Remove credentials.
      render: text
